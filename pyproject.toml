[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus-cli"
version = "0.2.0"
description = "Claude Code plugin with Mind Palace navigation, Icarus parallel workers, and Ariadne orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Kohl Jary", email = "kohlbern@gmail.com"},
    {name = "Daedalus"},
]
keywords = ["claude", "labyrinth", "mind-palace", "icarus", "ariadne", "parallelization", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "click>=8.0",
    # Mind Palace beyond Python: tree-sitter grammars as prebuilt wheels (no compiler, no network at runtime)
    "tree-sitter>=0.25",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-ruby>=0.23",
]

[project.optional-dependencies]
sdk = ["claude-agent-sdk>=0.1.0"]
# The bundled grammars are core dependencies; kept so `daedalus-cli[palace]` still installs
palace = []
# More languages (Kotlin, PHP, Scala, Lua) through tree-sitter-language-pack. It downloads a grammar the
# first time that language is analyzed, so those languages need network access once.
palace-all = ["tree-sitter-language-pack>=1.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
daedalus = "daedalus.cli:main"
icarus-worker = "daedalus.worker.harness:main"
ariadne = "daedalus.ariadne.orchestrator:main"
ariadne-bus = "daedalus.ariadne.diff_bus:main"
context-estimator = "daedalus.tools.context_estimator:main"

[project.urls]
Homepage = "https://github.com/KohlJary/daedalus"
Repository = "https://github.com/KohlJary/daedalus"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daedalus = [
    "identity/data/*.md",
    "identity/data/agents/*.md",
    "identity/data/*.json",
    "plugin/**/*",
    "labyrinth/queries/*.scm",
]
