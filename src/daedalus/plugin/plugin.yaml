name: daedalus-claude-plugin
version: 0.2.0
description: >
  Daedalus - Claude Code extensions for AI-assisted development.
  Includes Mind Palace (Labyrinth) navigation, Icarus parallel workers,
  Theseus complexity analysis, and project memory management.
author: Daedalus
license: MIT

manifest:
  agents: agents/
  commands: commands/
  skills: skills/
  hooks: hooks/
  templates: templates/

agents:
  - name: design-analyst
    description: UX/UI analysis with Playwright
  - name: delphi
    description: Reflection over session logs - findings and proposals from session digests; aspirations, asked cold
  - name: docs
    description: Documentation and codebase exploration
  - name: chorus
    description: The audience, rehearsed - reads a piece as each of its audiences would, before it goes out; reports reception, not truth
  - name: icarus
    description: Parallel worker identity for distributed execution
  - name: labyrinth
    description: Mind Palace MUD navigation - spatial codebase understanding
  - name: memory
    description: Project memory management across sessions
  - name: morpheus
    description: The dreamer's persona (edict 0013) - documentation; /dream sends its prompts, persona inline, to general-purpose
  - name: mnemosyne
    description: Memory reconstruction - proposes gameplan entries for an unrecorded period, from git evidence
  - name: momus
    description: Critic - tests claims and results before they are believed or published
  - name: roadmap
    description: Project planning and work item tracking
  - name: gameplan
    description: Multi-phase gameplan tracking — survives conversation compactions
  - name: test-runner
    description: Test generation and execution
  - name: theseus
    description: Code complexity analysis and refactoring guidance

commands:
  - name: memory
    description: View and update project memory
  - name: palace
    description: Navigate Mind Palace entities
  - name: theseus
    description: Analyze code health and complexity

skills:
  - name: mind-palace
    description: Spatial-semantic codebase navigation system
  - name: ariadne
    description: Query Ariadne orchestration - diff status, conflicts, verification results
  - name: exhale
    description: Preserve the session's work before a breakpoint or compaction
  - name: inhale
    description: Pick up where the last context left off
  - name: board
    description: Read and post on the agent board (threads between owners' agents; every post owner-approved)
  - name: reconstruct
    description: Rebuild a period the gameplan never recorded, from git (gather, mnemosyne, check, Momus)
  - name: reflect
    description: Run a due reflection over session logs (bundle, delphi, check, Momus); never applies proposals
  - name: ophanic
    description: Draw structure as Ophanic diagrams (layouts first; relationships as maps); lint with daedalus oph check
  - name: dream
    description: Dream (edict 0013) - seeds, a dream generated before it is judged, a cold waking pass; picks reach the plan only as proposals
