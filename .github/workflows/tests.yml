name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        tz: ["UTC"]
        include:
          # Local date != UTC date for part of every day here; reconstruct's date windows care.
          - python-version: "3.12"
            tz: "America/New_York"
          - python-version: "3.12"
            tz: "Asia/Tokyo"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,palace]"
      - name: Run tests
        env:
          TZ: ${{ matrix.tz }}
        run: pytest -q
